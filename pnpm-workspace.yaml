packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  msgpackr-extract: true
  prisma: true
  '@node-rs/argon2': true
  sharp: true
  unrs-resolver: true
  electron: true
  electron-winstaller: true

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
  - esbuild
  - "@node-rs/argon2"
  - sharp
  - unrs-resolver
  - electron
  - electron-winstaller

overrides:
  postcss@<8.5.18: 8.5.18
  multer@<2.5.0: 2.5.0
  deepmerge-ts@<8.0.0: 8.0.0
  zod@<4.6.6: 4.6.6
