name: grand-suite

# Local/demo stack. Secrets below are development defaults and MUST be replaced
# for any non-local deployment (see .env.example and docs/SECURITY.md).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: grandsuite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grandsuite}
      POSTGRES_DB: grandsuite
      TZ: Asia/Ho_Chi_Minh
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U grandsuite -d grandsuite']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru']
    ports:
      - '127.0.0.1:56379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgresql://grandsuite:${POSTGRES_PASSWORD:-grandsuite}@db:5432/grandsuite?schema=public
      REDIS_URL: redis://redis:6379
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-access-secret-please-replace-000000}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-only-refresh-secret-please-replace-000000}
      COOKIE_SECRET: ${COOKIE_SECRET:-dev-only-cookie-secret-please-replace-0000000}
      CSRF_SECRET: ${CSRF_SECRET:-dev-only-csrf-secret-please-replace-00000000}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-NinhVaNa@2026}
      SEED_ON_START: 'true'
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      STORAGE_LOCAL_DIR: /app/uploads
      TZ: Asia/Ho_Chi_Minh
    ports:
      - '4000:4000'
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:4000/api/v1/health/live']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_APP_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL:-http://localhost:4000}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - '3000:3000'

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - '127.0.0.1:8025:8025'
      - '127.0.0.1:1025:1025'

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-grandsuite}
      PGHOST: db
      PGUSER: grandsuite
      PGDATABASE: grandsuite
      BACKUP_RETENTION_DAYS: '7'
    volumes:
      - backups:/backups
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        while true; do
          stamp=$$(date +%Y%m%d-%H%M)
          tmp="/backups/grandsuite-$$stamp.sql.tmp"
          if pg_dump --no-owner --clean --if-exists -f "$$tmp"; then
            mv "$$tmp" "/backups/grandsuite-$$stamp.sql"
            echo "backup ok: $$stamp"
          else
            echo "backup failed: $$stamp" >&2
          fi
          find /backups -name 'grandsuite-*.sql' -mtime +$${BACKUP_RETENTION_DAYS} -delete
          sleep 86400
        done

volumes:
  pgdata:
  redisdata:
  uploads:
  backups:
